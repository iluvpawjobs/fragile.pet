<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justuno</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="preview-overlay" id="preview">
        <p class="preview-hint">click to view</p>
    </div>

    <main id="profileArea" class="profile-area hidden">
        <img src="profile.png" alt="profile" class="profile-pic">
        <div class="profile-info">
            <div class="alias">9</div>
            <div class="handle">@justuno</div>
        </div>
    </main>

    <audio id="audioPlayer" src="song.mp3" loop></audio>
</body>
</html>
